name: Publish to Modrinth

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      # gradle.properties pins org.gradle.java.home to a local macOS path; drop it so the CI JDK is used.
      - name: Use the CI JDK
        run: sed -i '/org.gradle.java.home/d' gradle.properties

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build

      # On a real release use the tag; on a manual dispatch fall back to the version in gradle.properties
      # so the Modrinth version is never named after the branch. Pre-release versions (1.0.0-rc.1) publish as beta.
      - name: Resolve version
        id: ver
        run: |
          if [ -n "$TAG" ]; then
            version="${TAG#v}"
          else
            version="$(grep '^mod_version=' gradle.properties | cut -d= -f2)+26.1"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          case "${version%%+*}" in
            *-alpha*) echo "type=alpha" >> "$GITHUB_OUTPUT" ;;
            *-*) echo "type=beta" >> "$GITHUB_OUTPUT" ;;
            *) echo "type=release" >> "$GITHUB_OUTPUT" ;;
          esac
        env:
          TAG: ${{ github.event.release.tag_name }}

      - uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: iPA46eKp
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          # The token only needs "Create versions"; skip unfeaturing older versions (which needs write scope).
          modrinth-unfeature-mode: none
          files: build/libs/!(*-sources).jar
          name: Enchantment Overhaul ${{ steps.ver.outputs.value }}
          version: ${{ steps.ver.outputs.value }}
          version-type: ${{ steps.ver.outputs.type }}
          loaders: fabric
          game-versions: |
            26.1
            26.1.1
            26.1.2
          dependencies: |
            fabric-api(required)
